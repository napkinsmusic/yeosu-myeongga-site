<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="여수명가 주문 및 결제" />
  <title>주문 / 결제 | 여수명가</title>
  <link rel="stylesheet" href="../css/style.css?v=3" />
  <link rel="stylesheet" href="../css/checkout.css?v=2" />
  <link rel="stylesheet" href="./css/mobile.css?v=31" />
  <script>window.YEOSU_ASSET_ROOT = "../";</script>
</head>
<body class="subpage">
  <header class="site-header" id="top">
    <span aria-hidden="true"></span>
    <a class="brand-logo" href="./index.html">
      <img src="../assets/images/logo.png" alt="여수명가" />
    </a>
    <nav class="header-right" aria-label="빠른 메뉴">
      <a class="header-action" href="./index.html#all-products">상품으로 돌아가기</a>
    </nav>
  </header>

  <main class="checkout-page">
    <div class="checkout-heading">
      <h1>주문 / 결제</h1>
    </div>

    <section class="checkout-empty" data-checkout-empty hidden>
      <h2>주문할 상품이 없습니다.</h2>
      <p>상품 상세페이지에서 주문하기를 선택해 주세요.</p>
      <a class="outline-button" href="./index.html#all-products">상품 보러 가기</a>
    </section>

    <form class="checkout-form" data-checkout-form hidden>
      <div class="checkout-fields">
        <section class="checkout-section">
          <h2>주문상품</h2>
          <div class="checkout-products" data-checkout-products></div>
        </section>

        <section class="checkout-section">
          <div class="form-grid">
            <label class="form-field form-field-wide">
              <span>이름</span>
              <input name="customerName" type="text" autocomplete="name" required />
            </label>
            <label class="form-field form-field-wide">
              <span>연락처</span>
              <input name="customerPhone" type="tel" autocomplete="tel" inputmode="tel" placeholder="010-0000-0000" required />
            </label>
            <div class="form-field form-field-wide">
              <span>주소 찾기</span>
              <div class="address-search-row">
                <input name="address1" type="text" autocomplete="off" inputmode="none" placeholder="주소를 검색해 주세요" readonly required />
                <button type="button" data-address-search>찾기</button>
              </div>
              <input name="zipcode" type="hidden" />
            </div>
            <label class="form-field form-field-wide">
              <span>상세주소</span>
              <input name="address2" type="text" autocomplete="address-line2" required />
            </label>
            <label class="form-field form-field-wide">
              <span>배송 요청사항</span>
              <select name="shippingRequest" data-shipping-request>
                <option value="">선택해 주세요</option>
                <option value="문 앞에 놓아주세요">문 앞에 놓아주세요</option>
                <option value="경비실에 맡겨주세요">경비실에 맡겨주세요</option>
                <option value="배송 전 연락주세요">배송 전 연락주세요</option>
                <option value="DIRECT">직접 입력</option>
              </select>
            </label>
            <label class="form-field form-field-wide" data-direct-request hidden>
              <span>요청사항 직접 입력</span>
              <input name="shippingRequestDirect" type="text" maxlength="100" />
            </label>
          </div>
          <p class="form-message" role="status" aria-live="polite" data-address-message></p>
        </section>
      </div>

      <aside class="checkout-summary">
        <h2>결제금액</h2>
        <dl>
          <div><dt>상품금액</dt><dd data-checkout-products-total>0원</dd></div>
          <div><dt>배송비</dt><dd data-checkout-shipping>0원</dd></div>
          <div><dt>할인</dt><dd data-checkout-discount>0원</dd></div>
          <div class="checkout-final"><dt>최종 결제금액</dt><dd data-checkout-total>0원</dd></div>
        </dl>

        <button class="checkout-submit" type="submit">결제하기</button>
        <p class="form-message" role="status" aria-live="polite" data-checkout-message></p>
      </aside>
    </form>
  </main>

  <footer class="site-footer">
    <div>
      <a class="footer-brand" href="./index.html">여수명가</a>
      <p>(주)전남산업콘텐츠연구원 · 대표 유란</p>
      <p>전남 여수시 돌산읍 신추길 6</p>
      <p>T. 010 3353 2724</p>
    </div>
    <p class="copyright">© YEOSU MYEONGGA. All rights reserved.</p>
  </footer>

  <script src="../js/products.js?v=3"></script>
  <script src="../js/store-config.js"></script>
  <script src="../js/firebase/firebase-config.js"></script>
  <script src="../js/services/product-service.js"></script>
  <script src="../js/services/order-service.js"></script>
  <script src="../js/services/payment-service.js"></script>
  <script src="../js/purchase-service.js?v=2"></script>
  <script src="../js/main.js?v=2"></script>
  <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js" data-postcode-script></script>
  <script src="../js/checkout.js?v=6"></script>
</body>
</html>
