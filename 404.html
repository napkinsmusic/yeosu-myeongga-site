<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>페이지를 찾을 수 없습니다 | 여수명가</title>
  <script>
    (function () {
      var ua = navigator.userAgent || "";
      var touchMac = navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
      var mobile = touchMac || /Android|iPhone|iPad|iPod|Mobile|IEMobile/i.test(ua);
      if (navigator.userAgentData && navigator.userAgentData.mobile) mobile = true;
      if (!mobile) return;
      var file = location.pathname.split("/").filter(Boolean).pop() || "index.html";
      if (!/\.html$/i.test(file)) file = "index.html";
      location.replace("m/" + file + location.search + location.hash);
    })();
  </script>
  <link rel="stylesheet" href="./css/style.css?v=3">
  <link rel="stylesheet" href="./css/error.css">
</head>
<body class="error-page">
  <header class="error-header">
    <a class="brand-logo" href="./index.html">
      <img src="./assets/images/logo.png" alt="여수명가" />
    </a>
  </header>
  <main class="error-content">
    <p class="eyebrow">404</p>
    <h1>페이지를 찾을 수 없습니다.</h1>
    <p>주소가 변경되었거나 존재하지 않는 페이지입니다.</p>
    <div class="error-actions">
      <a class="secondary" href="./index.html#all-products">상품 보기</a>
      <a href="./index.html">홈으로 이동</a>
    </div>
  </main>
</body>
</html>
